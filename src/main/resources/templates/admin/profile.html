<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>College Admin profile | EventEase</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="app-shell"><header th:replace="~{fragments/navigation :: topbar(${admin}, 'COLLEGE_ADMIN')}"></header><div class="app-layout"><aside th:replace="~{fragments/navigation :: sidebar('COLLEGE_ADMIN', 'profile')}"></aside><button type="button" class="mobile-nav-backdrop" aria-label="Close navigation"></button><main class="main-content">
  <div class="page-heading"><div><span class="eyebrow">Your account</span><h1>College Admin profile.</h1><p>Review your admin details.</p></div></div>
  <div class="profile-layout">
    <section class="card card-pad"><div class="card-header"><div><h2>College Admin information</h2><p>Details associated with your College Admin account.</p></div><button type="button" class="btn btn-secondary" data-toast="Profile editing is not available yet.">Edit profile</button></div>
      <div class="form-grid">
        <div class="form-field"><label>Admin ID</label><input class="field" th:value="${admin.adminId}" readonly></div>
        <div class="form-field"><label>Full name</label><input class="field" th:value="${admin.name}" readonly></div>
        <div class="form-field"><label>Email</label><input class="field" th:value="${admin.email}" readonly></div>
      </div>
    </section>
    <aside class="card card-pad profile-summary"><div class="profile-avatar" th:text="${#strings.substring(admin.name, 0, 1)}">A</div><h2 th:text="${admin.name}">College Admin</h2><p>College Admin · <span th:text="${admin.adminId}">Admin ID</span></p><span class="badge badge-success">College Admin account</span><div class="side-divider"></div><p class="small">Your events help students connect, learn, and make the most of campus life.</p></aside>
  </div>
</main></div></div><script src="/js/api.js"></script><script src="/js/app.js"></script></body>
</html>
