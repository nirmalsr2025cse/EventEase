spring.application.name=EventEase
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventease}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

eventease.jwt.secret-base64=${JWT_SECRET_BASE64:}
eventease.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:30}
eventease.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:14}
eventease.cookie.secure=${COOKIE_SECURE:false}
eventease.cookie.same-site=${COOKIE_SAME_SITE:Lax}
eventease.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
